# Copy the parts you need into group_vars/ (git-ignored):
#   group_vars/all.yml  ops_ssh_keys
#   group_vars/app.yml  deploy_ssh_keys

# group_vars/all.yml
# Humans who administer the hosts; they get sudo. Same keys as tc-streaming.
ops_ssh_keys:
  - "ssh-ed25519 AAAA... admin@example"

# group_vars/app.yml
# Key the deploy workflow uses (DEPLOY_SSH_KEY). No sudo; member of the docker group.
deploy_ssh_keys:
  - "ssh-ed25519 AAAA... github-actions-deploy-dashboard"
