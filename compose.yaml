# Local development. `docker compose up` runs PostgreSQL, Mailpit (catches all
# email: http://localhost:8025) and the API (which also serves the built SPA on
# http://localhost:8080). Add `--profile dev` for the Vite dev server with hot
# reload on http://localhost:5173, proxying /api to the API.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tropicast
      POSTGRES_USER: tropicast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tropicast-dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tropicast -d tropicast"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Database=tropicast;Username=tropicast;Password=${POSTGRES_PASSWORD:-tropicast-dev}
      Database__MigrateOnStartup: "true"
      App__PublicBaseUrl: http://localhost:${API_PORT:-8080}
      Email__From: Tropicast <no-reply@tropicast.localhost>
      Email__Smtp__Host: mail
      Email__Smtp__Port: "1025"
      Email__Smtp__Security: None
      # Icecast's node credentials for source auth (tc-streaming ICECAST_SOURCE_AUTH_USER/_PASSWORD).
      SourceAuth__NodeUsername: icecast
      SourceAuth__NodePassword: ${SOURCE_AUTH_PASSWORD:-source-auth-dev}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      # Internal source-auth endpoint, for a local Icecast (tc-streaming).
      - "127.0.0.1:${SOURCE_AUTH_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  # Development SMTP server: every email lands in its web UI, nothing is delivered.
  mail:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

  web:
    profiles: [dev]
    image: node:24-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
