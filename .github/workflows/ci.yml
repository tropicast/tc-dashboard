name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", LICENSE, NOTICE]
  pull_request:
    paths-ignore: ["**.md", LICENSE, NOTICE]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on pull requests only; every run on main finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build, test and API client
    runs-on: ubuntu-latest
    env:
      # Testcontainers' own images (Ryuk) from Google's Docker Hub mirror: Docker Hub fails on shared runners.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
    # Empty database for the migration bundle check.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The build also regenerates web/openapi/openapi.json.
      - run: dotnet build Tropicast.Dashboard.slnx -c Release

      - run: dotnet test --solution Tropicast.Dashboard.slnx -c Release --no-build

      - name: Fail when the model changed without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Tropicast.Dashboard.Infrastructure --configuration Release --no-build

      # Deploys run this self-contained bundle against the database; the API never migrates in production.
      - name: Build the migration bundle
        run: >
          dotnet ef migrations bundle --project src/Tropicast.Dashboard.Infrastructure --configuration Release
          --self-contained -r linux-x64 -o artifacts/efbundle --force

      - name: The bundle migrates an empty database and is a no-op the second time
        env:
          CONNECTION: Host=localhost;Database=postgres;Username=postgres;Password=ci-only
        run: |
          artifacts/efbundle --connection "$CONNECTION"
          artifacts/efbundle --connection "$CONNECTION" | tee second-run.txt
          if grep -q "Applying migration" second-run.txt; then echo "::error::The second run applied migrations."; exit 1; fi
          sql() { docker run --rm --network host -e PGPASSWORD=ci-only mirror.gcr.io/library/postgres:17-alpine psql -h localhost -U postgres -tAc "$1"; }
          migrations=$(find src/Tropicast.Dashboard.Infrastructure/Persistence/Migrations -name "*.Designer.cs" | wc -l)
          test "$(sql 'select count(*) from __ef_migrations_history')" -eq "$migrations"
          test "$(sql 'select count(*) from plans')" -eq 4

      - uses: actions/upload-artifact@v7
        # Artifacts are a convenience: a full storage quota must not fail the build.
        continue-on-error: true
        with:
          name: efbundle
          path: artifacts/efbundle
          retention-days: 7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Fail when the OpenAPI document or the generated client is stale
        working-directory: web
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- openapi src/api ||
            { echo "::error::Run 'dotnet build' and 'npm run generate:api' in web/, then commit the result."; exit 1; }

  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - run: npm run test:lighthouse

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          # BuildKit from Google's Docker Hub mirror: Docker Hub refuses or times out on shared runners.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tropicast-dashboard:ci
          # A fixed fake version: checks the VERSION build arg reaches the API (release.yml) and stays cached.
          build-args: VERSION=9.9.9-ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Health and SPA answer
        run: |
          docker run -d --name dashboard -p 127.0.0.1:8080:8080 tropicast-dashboard:ci
          trap 'docker logs dashboard; docker rm -f dashboard > /dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health/live > /dev/null && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/health/live)" = Healthy
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(curl -fsS http://127.0.0.1:8080/api/v1/version | jq -r .version)" = 9.9.9-ci

      # Vulnerabilities with a fix available, high or critical, in the OS packages and .NET runtime of the image.
      - name: Image vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock mirror.gcr.io/aquasec/trivy:0.69.3 \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 tropicast-dashboard:ci

  security:
    name: Dependency vulnerabilities and monitoring rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet packages (direct and transitive)
        run: |
          # A failing `dotnet list` must fail the step, not hide behind tee's exit code.
          set -o pipefail
          dotnet restore Tropicast.Dashboard.slnx
          dotnet list Tropicast.Dashboard.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages; see the list above." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # What ships in the SPA must be clean; build and test tooling is reported, not blocking.
      - name: npm packages
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::Development dependencies have known vulnerabilities (not shipped)."

      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" -w /m --entrypoint promtool \
            mirror.gcr.io/prom/prometheus:v3.15.0 test rules rules.test.yaml

      - name: Alloy configuration
        run: docker run --rm -v "$PWD/deploy/alloy:/etc/alloy:ro" mirror.gcr.io/grafana/alloy:v1.20.1 fmt /etc/alloy/config.alloy > /dev/null
