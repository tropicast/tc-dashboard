name: Image

# Builds and pushes the release images for every commit on main (#15):
#   ghcr.io/tropicast/dashboard:sha-<commit>             API + SPA
#   ghcr.io/tropicast/dashboard-migrations:sha-<commit>  migration bundle
# The deploy workflow deploys these tags.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Per-job Docker config: keep registry logins and buildx state in this job.
      - name: Isolate the Docker config
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          # BuildKit from Google's Docker Hub mirror: Docker Hub refuses or times out on shared runners.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/tropicast/dashboard:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Migration bundle image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrations
          push: true
          tags: ghcr.io/tropicast/dashboard-migrations:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=dashboard-migrations
          cache-to: type=gha,mode=max,scope=dashboard-migrations
