name: Deploy lint

on:
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/deploy-lint.yml
  push:
    branches: [main]
    paths:
      - deploy/**

permissions:
  contents: read

# A newer push to the same PR replaces the running build.
concurrency:
  # PRs share one group per PR; each main commit gets its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only PRs: runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: Connection string conversion
        run: |
          out=$(python3 deploy/npgsql.py 'postgresql://owner:p%3Bw@ep-x-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require')
          test "$out" = 'Host=ep-x-pooler.eu-central-1.aws.neon.tech;Port=5432;Database=neondb;Username=owner;Password="p;w";SSL Mode=Require'
      - name: Validate the production Compose file
        run: |
          env_file=$(mktemp)
          for name in APP_HOST ACME_EMAIL DATABASE_CONNECTION DATABASE_MIGRATION_CONNECTION EMAIL_FROM \
                      SMTP_HOST SMTP_USERNAME SMTP_PASSWORD SOURCE_AUTH_PASSWORD; do
            echo "$name='placeholder'" >> "$env_file"
          done
          echo "PRIVATE_IP='10.20.1.10'" >> "$env_file"
          DASHBOARD_IMAGE_TAG=sha-test docker compose -f deploy/compose.yaml --env-file "$env_file" --profile migrate config --quiet
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e APP_HOST=app.example.test -e ACME_EMAIL=ops@example.test \
            -v "$PWD/deploy/caddy:/etc/caddy:ro" mirror.gcr.io/library/caddy:2.11.6 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
