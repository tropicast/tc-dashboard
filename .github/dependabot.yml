# Dependency updates (#16 follow-up): weekly pull requests for the API's NuGet
# packages (central versions in Directory.Packages.props), the SPA's npm
# packages, the Dockerfile's base images, the Compose files' images and the
# workflow actions. Minor and patch updates are grouped per ecosystem; security
# updates come as soon as an advisory is published. Images named inside scripts
# and workflow steps (backup.sh, restore-test.sh, CI) are not covered: bump them by hand.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(nuget)"
    groups:
      # ASP.NET Core, EF Core and Microsoft.Extensions move together (AspNetCoreVersion/EfCoreVersion).
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
        update-types: [minor, patch]
      opentelemetry:
        patterns: ["OpenTelemetry*", "Npgsql.OpenTelemetry"]
        update-types: [minor, patch]
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    groups:
      # react-i18next majors require the matching i18next major (peer dependency): one PR for both.
      i18next:
        patterns: [i18next, react-i18next]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler): openapi-typescript and typescript-eslint peer on TypeScript 5.
      # Upgrade on purpose once they support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types follow the Node runtime (24, as in the Dockerfile and CI), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Base images: node (SPA build), and the .NET SDK, ASP.NET and runtime-deps images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # Major versions of the runtime and Node are a planned upgrade (global.json, package engines), not a bot PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images in the Compose files: Caddy (the public TLS entry point) and Alloy in
  # production (deploy/compose.yaml); PostgreSQL and Mailpit for local runs (compose.yaml).
  - package-ecosystem: docker-compose
    directories: [/, /deploy, /tests/e2e]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(compose)"
    ignore:
      # A new PostgreSQL major needs a dump and restore (and must match Neon); Node majors follow the
      # Dockerfile's. Upgrade both on purpose.
      - dependency-name: "*postgres*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*node*"
        update-types: ["version-update:semver-major"]

  # Workflow actions: the deploy workflows hold production secrets.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
